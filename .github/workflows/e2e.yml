name: E2E (live site)

# Runs the Playwright suite against the deployed demo on Chrome and Safari (WebKit),
# at phone and desktop sizes. Trigger manually after a deploy, and nightly so a
# broken live demo is caught early.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          E2E_BASE_URL: https://refillrounds.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
